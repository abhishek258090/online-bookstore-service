spring:
  datasource:
    url: jdbc:h2:mem:bookstore;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    defer-datasource-initialization: true
  h2:
    console:
      enabled: false
      path: /h2-console
  sql:
    init:
      mode: always
  data:
    web:
      pageable:
        max-page-size: 100
  profiles:
    active: local

app:
  jwt:
    secret: "${JWT_SECRET:change-this-development-secret-key-to-at-least-32-characters}"
    expiration-minutes: 120

server:
  port: 8081

logging:
  pattern:
    level: "%5p [traceId:%X{traceId:-}]"
